# Tests the game and exports the Web build on every PR; publishes to GitHub Pages on push to main.
# "test", "playtest" and "export-web" run in parallel on separate runners; "deploy" waits for all.
# Godot, its Web export templates and the import cache are cached (see .github/actions/setup-godot).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        run: godot --headless --path . --import

      - name: Unit tests
        run: |
          set -o pipefail
          godot --headless --path . -s tests/test_bit_logic.gd
          for t in tests/test_level_*.gd; do
            godot --headless --path . -s "$t" 2>&1 | tee -a levels.log
          done
          if grep -qE "SCRIPT ERROR" levels.log; then exit 1; fi

      - name: Smoke run (fails on script errors)
        run: |
          godot --headless --path . --quit-after 120 2>&1 | tee smoke.log
          for scene in scenes/level_*.tscn; do
            godot --headless --path . "res://$scene" --quit-after 120 2>&1 | tee -a smoke.log
          done
          if grep -qE "SCRIPT ERROR|Parse Error" smoke.log; then exit 1; fi

  # A bot plays every level in Chinese and English like a player, then mashes random input on
  # each level; it fails on stuck levels, script errors, text off screen or missing text.
  # The report shows on the run's Summary page and is kept as the "playtest-report" artifact.
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        run: godot --headless --path . --import

      - name: AI playtest
        run: tools/playtest.sh

      - name: Show report
        if: always()
        run: cat build/playtest/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-report
          path: build/playtest/
          retention-days: 14

  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          web-templates: "true"

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.pck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, playtest, export-web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
