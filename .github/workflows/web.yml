# Tests the game and exports the Web build on every PR; publishes to GitHub Pages on push to main.
# "test" and "export-web" run in parallel on separate runners; "deploy" waits for both.
# Godot, its Web export templates and the import cache are cached (see .github/actions/setup-godot).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        run: godot --headless --path . --import

      - name: Unit tests
        run: godot --headless --path . -s tests/test_bit_logic.gd

      - name: Smoke run (fails on script errors)
        run: |
          godot --headless --path . --quit-after 120 2>&1 | tee smoke.log
          godot --headless --path . res://scenes/level_01.tscn --quit-after 120 2>&1 | tee -a smoke.log
          if grep -qE "SCRIPT ERROR|Parse Error" smoke.log; then exit 1; fi

  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          web-templates: "true"

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.pck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, export-web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
